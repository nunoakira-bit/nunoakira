<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel — Nuno Akira Sugano</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --void:#0A0B0D;--panel:#101216;--raise:#161920;--bone:#EFE9DE;--dim:rgba(239,233,222,.56);
  --faint:rgba(239,233,222,.30);--line:rgba(239,233,222,.11);--brass:#C2A278;--warn:#D4785C;
  --ok:#7FA07A;--ui:"Inter Tight",system-ui,sans-serif;--mono:"JetBrains Mono",monospace;
  --display:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--bone);font-family:var(--ui);font-size:14px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:1px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}

/* ---- auth ---- */
#auth{min-height:100vh;display:grid;place-items:center;padding:24px}
#auth form{width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
#auth h1{font-family:var(--display);font-weight:300;font-size:26px;margin-bottom:2px}
#auth p{color:var(--dim);font-size:13px;margin-bottom:14px}
input,textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:rgba(194,162,120,.55)}
textarea{min-height:96px;resize:vertical;line-height:1.6}
.btn{background:var(--brass);color:#15120C;border-radius:8px;padding:10px 16px;font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--dim);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--bone);border-color:var(--faint)}
.btn.danger{background:none;color:var(--warn);border:1px solid rgba(212,120,92,.4)}
.msg{font-size:12.5px;color:var(--warn);min-height:18px}
.msg.ok{color:var(--ok)}

/* ---- shell ---- */
#app{display:none;grid-template-columns:216px 1fr;min-height:100vh}
#app.on{display:grid}
nav{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
nav .brand{font-family:var(--display);font-size:15px;padding:0 10px 18px}
nav .brand small{display:block;color:var(--faint);font-family:var(--mono);font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
nav button{text-align:left;padding:8px 10px;border-radius:7px;color:var(--dim);font-size:13.5px}
nav button:hover{background:var(--panel);color:var(--bone)}
nav button.on{background:var(--raise);color:var(--bone)}
nav .sep{height:1px;background:var(--line);margin:12px 4px}
nav .out{margin-top:auto;color:var(--faint);font-size:12px;padding:8px 10px;text-align:left}

main{padding:26px 30px 60px;min-width:0}
header.page{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:6px}
header.page h2{font-family:var(--display);font-weight:300;font-size:24px}
header.page p{color:var(--dim);font-size:13px;max-width:62ch;margin-top:6px}
.toolbar{display:flex;gap:8px;align-items:center;margin:20px 0 14px}
.count{color:var(--faint);font-size:12px;margin-left:auto}

/* ---- rows ---- */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);
  background:var(--panel)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--raise)}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{color:var(--faint);font-size:12px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;border:1px solid var(--line);color:var(--faint);flex:none}
.tag.published{color:var(--ok);border-color:rgba(127,160,122,.4)}
.tag.draft{color:var(--brass);border-color:rgba(194,162,120,.35)}
.tag.blocked{color:var(--warn);border-color:rgba(212,120,92,.45)}
.empty{padding:34px 18px;text-align:center;color:var(--faint);font-size:13px;line-height:1.7;
  border:1px dashed var(--line);border-radius:10px}

/* ---- editor ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel)}
.stat b{display:block;font-family:var(--display);font-weight:300;font-size:26px;margin-bottom:2px}
.stat span{color:var(--faint);font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase}
.panelbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);
  padding:16px 18px;margin-bottom:14px}
.panelbox h4{font-family:var(--display);font-weight:300;font-size:16px;margin-bottom:4px}
.panelbox .sub{color:var(--faint);font-size:12px;margin-bottom:14px;line-height:1.5}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:13px}
.bar .lbl{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{width:38%;height:4px;background:rgba(239,233,222,.07);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;background:var(--brass);opacity:.75}
.bar .n{width:36px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--faint)}
.qlist{display:flex;flex-direction:column;gap:9px}
.qlist div{font-size:13px;color:var(--dim);line-height:1.5;padding-left:13px;
  border-left:1px solid rgba(194,162,120,.35)}
.qlist small{display:block;color:var(--faint);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;margin-top:3px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:9px}
.media figure{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:var(--void);aspect-ratio:4/3}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media figcaption{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px;
  background:rgba(0,0,0,.72);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media .kill{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.7);color:var(--warn);font-size:13px;line-height:1;display:grid;place-items:center}
.media .kill:hover{background:rgba(212,120,92,.25)}
.drop{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;
  color:var(--faint);font-size:12.5px;cursor:pointer}
.drop:hover{border-color:var(--brass);color:var(--dim)}
.drop input{display:none}
#editor{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;justify-content:flex-end;z-index:10}
#editor.on{display:flex}
.drawer{width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);
  height:100vh;overflow-y:auto;padding:24px 26px 40px;animation:slide .3s cubic-bezier(.22,.61,.36,1)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.drawer h3{font-family:var(--display);font-weight:300;font-size:20px}
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:6px;color:var(--dim);font-size:12.5px}
.field .hint{color:var(--faint);font-size:11.5px;margin-top:5px;line-height:1.5}
.field.check{display:flex;align-items:center;gap:10px}
.field.check input{width:auto}
.field.check label{margin:0}
.drawer footer{display:flex;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.drawer footer .btn.danger{margin-left:auto}
.blocked-note{border-left:2px solid var(--warn);padding:10px 12px;margin-bottom:16px;
  color:var(--dim);font-size:12.5px;line-height:1.6;background:rgba(212,120,92,.06)}
@media (max-width:760px){
  #app.on{grid-template-columns:1fr}
  nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
  nav .brand,nav .sep{display:none}
  nav .out{margin:0}
  main{padding:20px 16px 50px}
}
</style>

<section id="auth">
  <form id="loginform">
    <h1>Panel</h1>
    <p>This is where the creature's knowledge lives. Sign in to edit it.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
    <div class="msg" id="authmsg"></div>
  </form>
</section>

<div id="app">
  <nav>
    <div class="brand">Nuno Akira Sugano<small>Knowledge panel</small></div>
    <div id="navlist"></div>
    <button class="out" id="signout">Sign out</button>
  </nav>
  <main>
    <header class="page"><div><h2 id="ptitle"></h2><p id="pdesc"></p></div></header>
    <div class="toolbar">
      <button class="btn" id="new">New entry</button>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </main>
</div>

<div id="editor"><div class="drawer">
  <header><h3 id="etitle"></h3><button class="btn ghost" id="ecancel">Close</button></header>
  <div id="eform"></div>
  <footer>
    <button class="btn" id="esave">Save</button>
    <button class="btn ghost" id="epublish"></button>
    <button class="btn danger" id="edelete">Delete</button>
  </footer>
  <div class="msg" id="emsg" style="margin-top:12px"></div>
</div></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://oupeamarlnmnvezejwpz.supabase.co";
const SUPABASE_KEY = "sb_publishable_wSrom0o1WywfOr7n05n7Mg_FjwwSQ1V";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const T = (label, hint) => ({ t:"text", label, hint });
const A = (label, hint) => ({ t:"area", label, hint });
const L = (label, hint) => ({ t:"list", label, hint });
const B = (label, hint) => ({ t:"bool", label, hint });
const N = (label) => ({ t:"num", label });
const D = (label) => ({ t:"date", label });
const STATUS = { t:"select", label:"Status", options:["draft","published","archived"],
  hint:"Nothing reaches the assistant until it is published." };
const M = (label, hint) => ({ t:"media", label, hint });
const K = (label, hint) => ({ t:"links", label, hint });

// ---------------------------------------------------------------------------
//  Every section is a table plus a field map. Adding a field here is the only
//  change needed to expose it — the form and the list build themselves.
// ---------------------------------------------------------------------------
const SECTIONS = {
  profile: { label:"Profile", single:true, title:"name", sub:"role",
    desc:"Who Nuno is, in the words the assistant will use. One published row.",
    fields:{ name:T("Name"), role:T("Role"), headline:T("Headline"),
      summary:A("Professional summary"), bio_short:A("Short bio"), bio_full:A("Full bio"),
      location:T("Location"), availability:A("Availability"),
      multicultural_context:A("Multicultural context"), career_goals:A("Career goals"),
      status:STATUS } },

  resumes: { label:"Résumé", title:"title", sub:"language", upload:true,
    desc:"Upload the PDF and describe it. The structured data lives in the other sections — the file is not parsed.",
    fields:{ title:T("Title"), language:T("Language","pt-BR, en-US or ja-JP"),
      version_date:D("Version date"), description:A("Short description"),
      is_primary:B("Primary résumé for this language"), status:STATUS } },

  experiences: { label:"Experience", title:"company", sub:"role",
    desc:"Roles, dates and confirmed results. Nothing here is generated — if Nuno did not confirm it, leave it out.",
    fields:{ company:T("Company"), role:T("Role"), start_date:D("Start"), end_date:D("End"),
      is_current:B("Current role"), description:A("Description"),
      responsibilities:L("Responsibilities","One per line."),
      confirmed_results:L("Confirmed results","One per line. Only what you can stand behind."),
      related_skills:L("Related skills"), confirmed_tools:L("Tools"),
      display_order:N("Order"), is_confidential:B("Confidential — never shown or told"),
      status:STATUS } },

  skills: { label:"Skills", title:"name", sub:"category",
    desc:"No levels, no percentages. Evidence is what makes a skill credible.",
    fields:{ name:T("Name"), category:T("Category"), description:A("Description"),
      evidence:A("Evidence","Where this shows up in real work."),
      priority:N("Priority"), status:STATUS } },

  education: { label:"Education", title:"institution", sub:"degree",
    desc:"Formal education.",
    fields:{ institution:T("Institution"), course:T("Course"), degree:T("Degree"),
      period:T("Period"), description:A("Description"), display_order:N("Order"), status:STATUS } },

  languages: { label:"Languages", title:"language", sub:"level",
    desc:"Real levels only. The assistant is instructed never to round a level up.",
    fields:{ language:T("Language"), level:T("Level"), description:A("Description"),
      reading:T("Reading"), writing:T("Writing"), speaking:T("Speaking"),
      notes:A("Notes"), display_order:N("Order"), status:STATUS } },

  contacts: { label:"Contacts", title:"value", sub:"kind",
    desc:"The assistant can only ever give out what is published and public here. It never writes a contact freely.",
    fields:{ kind:T("Type","email, phone, whatsapp, linkedin, site, resume, location"),
      label:T("Label"), value:T("Value"), url:T("URL"), priority:N("Priority"),
      is_public:B("Public"), status:STATUS } },

  knowledge: { label:"Knowledge", title:"title", sub:"category",
    desc:"Facts. How Nuno works, what he prefers, answers to questions that keep coming up.",
    fields:{ title:T("Title"), content:A("Content"),
      category:T("Category","Professional background, Work preferences, Availability, Career goals, Personal introduction, Working methods, Product philosophy, Design process, FAQ, Japan context, Contact guidance, Other"),
      language:T("Language","Leave empty to apply to all languages."),
      keywords:L("Keywords"), priority:N("Priority"), source:T("Source"),
      is_confidential:B("Confidential"), available_to_ai:B("Available to the assistant"),
      expires_at:D("Expires"), notes:A("Notes"), status:STATUS } },

  commands: { label:"Behaviour", title:"name", sub:"category", guard:true,
    desc:"How she should act — not what is true. Style sits below the safety, truthfulness and authorship rules and can never override them.",
    fields:{ name:T("Name"), instruction:A("Instruction"),
      category:T("Category","Tone of voice, Response style, Language, Conversation flow, Contact, Professional positioning, Restricted topics, Authorship, Safety, Suggested actions, Other"),
      scope:T("Scope","global, pt, en, ja, voice, text, contact, resume, experiences"),
      priority:N("Priority"), activation_condition:T("Activation condition"),
      positive_examples:L("Good examples"), forbidden_examples:L("Forbidden examples"),
      is_active:B("Active"), notes:A("Notes"), status:STATUS } },

  cases: { label:"Cases", title:"name", sub:"summary", media:true,
    desc:"The narrative work. Screens, diagrams and links live here — they are what turns a description of the work into evidence of it.",
    fields:{ name:T("Name"), slug:T("Slug","Lowercase, no spaces. Used in URLs."),
      summary:A("Positioning","What capability should this case prove?"),
      problem:A("Core question / problem"), context:A("Context"),
      audience:T("Audience"), nuno_role:A("Nuno's role"),
      responsibilities:L("Responsibilities","One per line."),
      constraints:A("Constraints"), process:A("Process and discovery"),
      decisions:A("Key decisions"), alternatives:A("Alternatives considered"),
      prototypes:A("Solution and prototypes"), validation:A("Validation"),
      team:A("Collaboration and team"),
      results:A("Outcome","Only confirmed results. If there are none yet, say so plainly."),
      learnings:A("What it demonstrates and takeaway"),
      skills:L("Skills","One per line."),
      images:M("Screens and images","Upload the work. Captions are read by the assistant, so name what the screen shows."),
      diagrams:M("Diagrams"), videos:K("Videos","One per line: Label | https://…"),
      links:K("Links","One per line: Label | https://…"),
      display_order:N("Order"),
      is_confidential:B("Confidential — never shown or told"),
      available_to_ai:B("Available to the assistant"),
      status:STATUS } },

  suggestions: { label:"Suggestions", title:"text", sub:"language",
    desc:"The prompts offered under the sphere.",
    fields:{ text:T("Text"), language:T("Language","pt, en or ja"), category:T("Category"),
      display_order:N("Order"), expected_context:T("Expected context"),
      visual_action:T("Card to show","show_experience, show_skills, show_contact_options…"),
      is_active:B("Active"), status:STATUS } },
};

// ---------------------------------------------------------------------------
//  §22 — a command that tries to climb above the rules is refused, with a reason.
// ---------------------------------------------------------------------------
const GUARDS = [
  { re:/\b(invent|make up|imagine|assume|estimate|fabricat)/i,
    why:"asks the assistant to state things that were never confirmed. Truthfulness sits above style." },
  { re:/\b(we (created|made|designed|built|developed)|our (project|work)|co-?author|you helped|part of the team)/i,
    why:"would put the assistant inside Nuno's work. She took part in none of it." },
  { re:/\b(fluent (in )?japanese|advanced japanese|nativ\w* japanese)/i,
    why:"overstates Nuno's Japanese, which is basic." },
  { re:/\b(confidential|private|api[_ ]?key|secret|system (prompt|instruction))/i,
    why:"touches confidential material or the instructions themselves." },
  { re:/\b(ignore|override|disregard)\b.{0,24}\b(rule|instruction|above)/i,
    why:"tries to override rules that sit above administrative commands." },
];
function guardCheck(text){
  for(const g of GUARDS) if(g.re.test(text||"")) return g.why;
  return null;
}

// ---------------------------------------------------------------------------
//  Auth
// ---------------------------------------------------------------------------
let current = "profile", rows = [], editing = null;

$("loginform").onsubmit = async e => {
  e.preventDefault();
  $("authmsg").className = "msg"; $("authmsg").textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("password").value });
  if(error){ $("authmsg").textContent = error.message; return; }
  boot();
};
$("signout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function boot(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;
  const { data:admin } = await sb.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
  if(!admin){
    $("authmsg").className = "msg";
    $("authmsg").textContent = "This account is signed in but not an admin. Add its id to the admins table.";
    await sb.auth.signOut();
    return;
  }
  $("auth").style.display = "none";
  $("app").classList.add("on");
  buildNav();
  open("profile");
}

function buildNav(){
  const box = $("navlist"); box.innerHTML = "";
  const ins = document.createElement("button");
  ins.textContent = "Insights"; ins.dataset.k = "_insights";
  ins.onclick = () => openInsights();
  box.append(ins);
  const sep0 = document.createElement("div"); sep0.className = "sep"; box.append(sep0);
  Object.entries(SECTIONS).forEach(([k,s],i) => {
    if(i === 7){ const d = document.createElement("div"); d.className = "sep"; box.append(d); }
    const b = document.createElement("button");
    b.textContent = s.label; b.dataset.k = k;
    b.onclick = () => open(k);
    box.append(b);
  });
}

// ---------------------------------------------------------------------------
//  List
// ---------------------------------------------------------------------------
async function open(key){
  current = key;
  const s = SECTIONS[key];
  [...$("navlist").children].forEach(b => b.classList?.toggle("on", b.dataset?.k === key));
  $("ptitle").textContent = s.label;
  $("pdesc").textContent = s.desc;
  $("new").style.display = s.single && rowsHasOne(key) ? "none" : "";
  $("list").innerHTML = '<div class="empty">Loading…</div>';

  const { data, error } = await sb.from(key).select("*")
    .order("updated_at", { ascending:false, nullsFirst:false });
  if(error){ $("list").innerHTML = '<div class="empty">'+error.message+"</div>"; return; }
  rows = data ?? [];
  $("count").textContent = rows.length + (rows.length === 1 ? " entry" : " entries");
  $("new").style.display = s.single && rows.length ? "none" : "";

  if(!rows.length){
    $("list").innerHTML = '<div class="empty">Nothing here yet.<br>Whatever you add becomes what the assistant is allowed to say.</div>';
    return;
  }
  const box = document.createElement("div"); box.className = "rows";
  rows.forEach(r => {
    const el = document.createElement("div"); el.className = "row";
    const blocked = key === "commands" && r.rejected_reason;
    el.innerHTML = `<div class="t"><b></b><span></span></div>
      <span class="tag ${blocked ? "blocked" : r.status}">${blocked ? "blocked" : r.status}</span>`;
    el.querySelector("b").textContent = r[s.title] ?? "—";
    el.querySelector("span").textContent = r[s.sub] ?? "";
    el.onclick = () => edit(r);
    box.append(el);
  });
  $("list").innerHTML = ""; $("list").append(box);
}
function rowsHasOne(){ return false; }
$("new").onclick = () => edit(null);

// ---------------------------------------------------------------------------
//  Editor
// ---------------------------------------------------------------------------
function edit(row){
  editing = row;
  const s = SECTIONS[current];
  $("etitle").textContent = row ? (row[s.title] || "Edit") : "New " + s.label.toLowerCase();
  $("emsg").textContent = "";
  const form = $("eform"); form.innerHTML = "";

  if(current === "commands" && row?.rejected_reason){
    const n = document.createElement("div"); n.className = "blocked-note";
    n.textContent = "Not applied: this command " + row.rejected_reason +
      " Edit the instruction and save again to clear it.";
    form.append(n);
  }

  for(const [k,f] of Object.entries(s.fields)){
    const wrap = document.createElement("div");
    wrap.className = "field" + (f.t === "bool" ? " check" : "");
    const id = "f_" + k;
    let control;
    if(f.t === "area"){ control = document.createElement("textarea"); control.value = row?.[k] ?? ""; }
    else if(f.t === "list"){ control = document.createElement("textarea");
      control.value = (row?.[k] ?? []).join("\n"); }
    else if(f.t === "bool"){ control = document.createElement("input"); control.type = "checkbox";
      control.checked = !!row?.[k]; }
    else if(f.t === "media"){
      control = document.createElement("div");
      control.dataset.kind = "media";
      control.dataset.value = JSON.stringify(row?.[k] ?? []);
      renderMedia(control);
    }
    else if(f.t === "links"){
      control = document.createElement("textarea");
      control.value = (row?.[k] ?? []).map(x => (x.label ? x.label + " | " : "") + x.url).join("\n");
    }
    else if(f.t === "select"){ control = document.createElement("select");
      f.options.forEach(o => { const op = document.createElement("option");
        op.value = o; op.textContent = o; control.append(op); });
      control.value = row?.[k] ?? "draft"; }
    else { control = document.createElement("input");
      control.type = f.t === "num" ? "number" : f.t === "date" ? "date" : "text";
      control.value = row?.[k] ?? ""; }
    control.id = id;
    const lab = document.createElement("label"); lab.htmlFor = id; lab.textContent = f.label;
    if(f.t === "bool"){ wrap.append(control, lab); } else { wrap.append(lab, control); }
    if(f.hint){ const h = document.createElement("div"); h.className = "hint";
      h.textContent = f.hint; wrap.append(h); }
    form.append(wrap);
  }

  if(s.media){
    const wrap = document.createElement("div"); wrap.className = "field";
    wrap.innerHTML = '<label>Add images</label>' +
      '<label class="drop">Choose files — they upload when you save' +
      '<input id="f_files" type="file" accept="image/*" multiple></label>';
    const h2 = document.createElement("div"); h2.className = "hint";
    h2.textContent = row ? "Files attach to this case." :
      "Save the case first, then reopen it to attach images.";
    wrap.append(h2);
    form.append(wrap);
  }

  if(s.upload){
    const wrap = document.createElement("div"); wrap.className = "field";
    wrap.innerHTML = '<label for="f_file">PDF file</label><input id="f_file" type="file" accept="application/pdf">';
    const h = document.createElement("div"); h.className = "hint";
    h.textContent = row?.storage_path ? "Currently: " + row.storage_path : "No file uploaded yet.";
    wrap.append(h); form.append(wrap);
  }

  $("edelete").style.display = row ? "" : "none";
  $("epublish").style.display = row ? "" : "none";
  $("epublish").textContent = row?.status === "published" ? "Unpublish" : "Publish";
  $("editor").classList.add("on");
}
$("ecancel").onclick = () => $("editor").classList.remove("on");
$("editor").onclick = e => { if(e.target === $("editor")) $("editor").classList.remove("on"); };

// ---------------------------------------------------------------------------
//  Insights. Read-only, aggregated in the browser from raw events.
// ---------------------------------------------------------------------------
async function openInsights(){
  current = "_insights";
  [...$("navlist").children].forEach(b => b.classList?.toggle("on", b.dataset?.k === "_insights"));
  $("ptitle").textContent = "Insights";
  $("pdesc").textContent = "Anonymous. No cookies, no IP, no identity — region comes from the visitor's own timezone.";
  $("new").style.display = "none";
  $("count").textContent = "";
  $("list").innerHTML = '<div class="empty">Loading…</div>';

  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const { data, error } = await sb.from("analytics_events")
    .select("session_id,event,props,language,timezone,device,created_at")
    .gte("created_at", since).order("created_at", { ascending:false }).limit(5000);
  if(error){ $("list").innerHTML = '<div class="empty">' + error.message + "</div>"; return; }
  const rows = data ?? [];
  if(!rows.length){
    $("list").innerHTML = '<div class="empty">No visits recorded yet.<br>' +
      'Numbers appear here once the updated site is published.</div>';
    return;
  }

  const sessions = new Set(rows.map(r => r.session_id));
  const evs = e => rows.filter(r => r.event === e);
  const uniq = e => new Set(evs(e).map(r => r.session_id)).size;

  const began = uniq("began"), asked = uniq("asked"), voice = uniq("voice_on");
  const resume = evs("resume").length;
  const lefts = evs("left");
  const avgTurns = lefts.length
    ? (lefts.reduce((n,r) => n + (r.props?.turns || 0), 0) / lefts.length) : 0;
  const bounced = lefts.filter(r => (r.props?.turns || 0) === 0).length;

  const tally = (arr, key) => {
    const m = {};
    arr.forEach(r => { const k = key(r); if(k) m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a,b) => b[1] - a[1]);
  };
  const region = t => (t || "").split("/")[0] || "—";

  const bars = (title, sub, pairs, max) => {
    if(!pairs.length) return "";
    const top = pairs[0][1] || 1;
    return '<div class="panelbox"><h4>' + title + '</h4><div class="sub">' + sub + "</div>" +
      pairs.slice(0, max).map(([k,n]) =>
        '<div class="bar"><span class="lbl">' + k + '</span>' +
        '<span class="track"><span class="fill" style="width:' + (n/top*100) + '%"></span></span>' +
        '<span class="n">' + n + "</span></div>").join("") + "</div>";
  };

  const questions = evs("asked").map(r => (r.props?.text || "").trim()).filter(Boolean);

  $("list").innerHTML =
    '<div class="stats">' +
      stat(sessions.size, "visitors") +
      stat(began, "started talking") +
      stat(asked, "asked something") +
      stat(voice, "used voice") +
      stat(resume, "résumé downloads") +
      stat(avgTurns.toFixed(1), "questions each") +
    "</div>" +

    '<div class="panelbox"><h4>Where they stop</h4><div class="sub">' +
      'Of ' + sessions.size + ' visitors, ' + began + ' entered the conversation and ' +
      asked + ' asked at least one question. ' + bounced +
      ' left without asking anything — that is the number worth moving.' +
      "</div></div>" +

    bars("What they ask", "Every question, most frequent first. This is the most useful thing the site produces: it tells you what to publish next.",
         tally(evs("asked"), r => (r.props?.text || "").trim().toLowerCase()), 15) +

    bars("Language", "Chosen at the door.", tally(rows, r => r.language), 5) +
    bars("Region", "From the browser timezone.", tally(rows, r => region(r.timezone)), 8) +
    bars("Device", "", tally(rows, r => r.device), 3) +
    bars("Buttons clicked", "Every control, most used first.",
         tally(evs("click"), r => LABEL[r.props?.el] || r.props?.el), 12) +

    bars("Contact links opened", "The closest thing this site has to a conversion.",
         tally(evs("click").filter(r => r.props?.el === "contact_link"),
               r => r.props?.label), 6) +

    bars("Typed or tapped", "A visitor who types is a stronger signal than one who only taps what you offered.",
         tally(evs("asked"), r => r.props?.source === "chip" ? "tapped a suggestion" : "typed their own"), 3) +

    bars("Suggestions tapped", "Which prompts pull people in.",
         tally(evs("click").filter(r => r.props?.el === "suggestion"), r => r.props?.text), 10) +

    bars("Cards shown", "Which tools the assistant decided to surface.",
         tally(evs("card"), r => r.props?.tool), 10) +

    (questions.length ? '<div class="panelbox"><h4>Most recent questions</h4>' +
      '<div class="sub">Verbatim, truncated to 200 characters.</div><div class="qlist">' +
      evs("asked").slice(0, 12).map(r =>
        "<div>" + (r.props?.text || "") + "<small>" + (r.language || "") + " · " +
        new Date(r.created_at).toLocaleString() + "</small></div>").join("") +
      "</div></div>" : "");
}
const LABEL = {
  suggestion:"suggestion chip", contact_link:"contact link", card_close:"closed a card",
  mic_start:"microphone on", mic_stop:"microphone off", sound_on:"sound on",
  sound_off:"sound off", change_language:"change language", transcript:"transcript",
  gate_resume:"résumé, from the entrance"
};
function stat(v, label){
  return '<div class="stat"><b>' + v + "</b><span>" + label + "</span></div>";
}

// Images are stored as [{path, url, caption}]. The caption travels to the
// assistant, so it is worth writing something descriptive.
function renderMedia(box){
  const list = JSON.parse(box.dataset.value || "[]");
  box.innerHTML = "";
  if(!list.length){
    const p = document.createElement("div"); p.className = "hint";
    p.textContent = "No images yet.";
    box.append(p); return;
  }
  const grid = document.createElement("div"); grid.className = "media";
  list.forEach((m, idx) => {
    const fig = document.createElement("figure");
    const img = document.createElement("img"); img.src = m.url; img.alt = m.caption || "";
    const cap = document.createElement("figcaption"); cap.textContent = m.caption || "";
    cap.title = "Click to rename";
    cap.onclick = () => {
      const v = prompt("Caption — describe what this screen shows:", m.caption || "");
      if(v === null) return;
      list[idx].caption = v;
      box.dataset.value = JSON.stringify(list);
      renderMedia(box);
    };
    const kill = document.createElement("button");
    kill.className = "kill"; kill.textContent = "×"; kill.title = "Remove";
    kill.onclick = async () => {
      if(!confirm("Remove this image?")) return;
      if(m.path) await sb.storage.from("case-media").remove([m.path]);
      list.splice(idx, 1);
      box.dataset.value = JSON.stringify(list);
      renderMedia(box);
    };
    fig.append(img, cap, kill);
    grid.append(fig);
  });
  box.append(grid);
}

function collect(){
  const s = SECTIONS[current], out = {};
  for(const [k,f] of Object.entries(s.fields)){
    const el = $("f_" + k);
    if(f.t === "media") out[k] = JSON.parse(el.dataset.value || "[]");
    else if(f.t === "links") out[k] = el.value.split("\n").map(v => v.trim()).filter(Boolean)
      .map(line => { const i = line.lastIndexOf("|");
        return i > -1 ? { label: line.slice(0, i).trim(), url: line.slice(i + 1).trim() }
                      : { label: "", url: line }; });
    else if(f.t === "bool") out[k] = el.checked;
    else if(f.t === "list") out[k] = el.value.split("\n").map(v => v.trim()).filter(Boolean);
    else if(f.t === "num") out[k] = Number(el.value || 0);
    else out[k] = el.value.trim() === "" ? null : el.value.trim();
  }
  return out;
}

async function save(publishToggle){
  const s = SECTIONS[current];
  const payload = collect();
  $("emsg").className = "msg"; $("emsg").textContent = "Saving…";

  if(s.guard){
    const why = guardCheck(payload.instruction);
    payload.rejected_reason = why;
    if(why) payload.status = "draft";
  }
  if(publishToggle) payload.status = editing?.status === "published" ? "draft" : "published";
  if(s.guard && payload.rejected_reason && payload.status === "published") payload.status = "draft";

  let id = editing?.id, err;
  if(editing){ ({ error:err } = await sb.from(current).update(payload).eq("id", editing.id)); }
  else { const r = await sb.from(current).insert(payload).select("id").single();
    err = r.error; id = r.data?.id; }
  if(err){ $("emsg").textContent = err.message; return; }

  const files = $("f_files")?.files;
  if(files && files.length && id){
    const bucket = sb.storage.from("case-media");
    const gathered = [];
    for(const f of files){
      const path = id + "/" + Date.now() + "_" + f.name.replace(/[^\w.\-]/g, "_");
      const up = await bucket.upload(path, f, { upsert:true });
      if(up.error){ $("emsg").textContent = "Upload failed: " + up.error.message; continue; }
      gathered.push({ path, url: bucket.getPublicUrl(path).data.publicUrl,
                      caption: f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ") });
    }
    if(gathered.length){
      const merged = (payload.images || []).concat(gathered);
      await sb.from(current).update({ images: merged }).eq("id", id);
    }
  }

  const file = $("f_file")?.files?.[0];
  if(file && id){
    const path = id + "/" + file.name.replace(/[^\w.\-]/g, "_");
    const up = await sb.storage.from("resumes").upload(path, file, { upsert:true });
    if(up.error){ $("emsg").textContent = "Saved, but the upload failed: " + up.error.message; }
    else await sb.from("resumes").update({ storage_path: path }).eq("id", id);
  }

  if(id){
    await sb.from("content_versions").insert({
      table_name: current, record_id: id, snapshot: payload, status: payload.status });
  }

  $("emsg").className = "msg ok";
  $("emsg").textContent = s.guard && payload.rejected_reason
    ? "Saved as a draft. It was not applied because it " + payload.rejected_reason
    : "Saved.";
  setTimeout(() => { $("editor").classList.remove("on"); open(current); }, 700);
}
$("esave").onclick = () => save(false);
$("epublish").onclick = () => save(true);
$("edelete").onclick = async () => {
  if(!editing) return;
  if(!confirm("Delete this entry? The assistant will stop being able to mention it.")) return;
  const { error } = await sb.from(current).delete().eq("id", editing.id);
  if(error){ $("emsg").textContent = error.message; return; }
  $("editor").classList.remove("on"); open(current);
};

sb.auth.getSession().then(({ data:{ session } }) => { if(session) boot(); });
</script>
